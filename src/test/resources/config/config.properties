base.url=https://ecommerce-playground.lambdatest.io/index.php?route=account/login
store.home.url=https://ecommerce-playground.lambdatest.io/index.php?route=common/home
# Optional: set both to skip auto-registration in MyAccountUiTest (use an existing store user).
test.login.email=
test.login.password=
api.base.url=https://reqres.in
api.max.response.ms=2000
# Secret: config.local.properties veya env API_REQRES_API_KEY
api.reqres.api.key=
run.ui.layer=true
run.api.layer=true
run.db.layer=true
run.e2e.layer=true
browser=chrome
headless=false
implicit.wait.seconds=1
explicit.wait.seconds=8
# H2 in-memory (izole DB katmanı testleri — DbTest)
db.h2.driver=org.h2.Driver
db.h2.url=jdbc:h2:mem:qatest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Regular
db.h2.user=sa
db.h2.password=

# SQL Server (UI ↔ DB çapraz doğrulama)
# Secret: config.local.properties veya env DB_SQLSERVER_PASSWORD / DB_PASSWORD
run.db.ui.verify=true
db.sqlserver.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
db.sqlserver.integratedSecurity=false
db.sqlserver.url=jdbc:sqlserver://localhost;databaseName=TestDb;encrypt=true;trustServerCertificate=true
db.sqlserver.user=testauto
db.sqlserver.password=
ai.provider=groq
# Secret: config.local.properties veya env AI_API_KEY / GROQ_API_KEY
ai.api.key=
ai.endpoint=https://api.groq.com/openai/v1/chat/completions
ai.model=llama-3.1-8b-instant
ai.ml.endpoint=http://127.0.0.1:5000/predict

# Jira bug raporlama (Turkcell Global Bilgi formatı)
jira.enabled=false
jira.base.url=
jira.project.key=LTPLAY
jira.project.keys=LTPLAY,ECOMQA,QA
jira.issue.type=Bug
jira.email=
jira.api.token=
jira.proxy.url=http://127.0.0.1:5000
jira.channel=Web
jira.qa.origin=Test Otomasyon
jira.qa.process=Regression
